profile:
  name: Physics Residual Dynamics and Reduced Order Whole-Body Planning for Obstacle Aware Human Robot Cloth CoTransportation
  interests:
    - name: AI agents
      keywords:
        - physics-residual dynamics
        - recurrent variational autoencoder cloth dynamics
        - MPPI deformable object planning
      weight: 1.0
    - name: Local language models
      keywords:
        - contrast-maximization motion estimation
        - microsecond-latency visual sensing
        - ONNX inference on event streams
      weight: 0.8
  exclusions:
    - medical imaging
    - autonomous weapons

sources:
  arxiv:
    enabled: true
    categories:
      - cs.AI
      - cs.CL
    max_results: 5
    lookback_days: 7
  github:
    enabled: true
    queries:
      - deformable object manipulation
      - event camera motion estimation
    max_results: 25
    lookback_days: 30
    max_readme_characters: 30000

ranking:
  minimum_score: 1.0
  recency_weight: 0.5
  recency_window_days: 30

ollama:
  base_url: http://localhost:11434
  model: llama3.2
  timeout_seconds: 120

analysis:
  max_papers_per_run: 10
  max_repositories_per_run: 10

content:
  papers:
    enabled: false
    max_download_bytes: 20000000
    max_pages: 40
    max_characters: 60000
  repositories:
    enabled: false
    include_patterns:
      - "*.py"
      - "**/*.py"
      - "*.rs"
      - "**/*.rs"
      - "*.ts"
      - "**/*.ts"
    exclude_patterns:
      - "tests/**"
      - "vendor/**"
      - "node_modules/**"
      - "dist/**"
      - "build/**"
    max_files: 6
    max_file_bytes: 200000
    max_total_characters: 60000

digest:
  output_directory: digests
  max_papers: 10
  max_repositories: 10

exports:
  obsidian:
    vault_path: null
    folder: ResearchPilot
