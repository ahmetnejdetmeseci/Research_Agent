[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpilot"
version = "0.6.0"
description = "A local-first personal AI research assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ResearchPilot contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
researchpilot = "researchpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchpilot = ["persistence/migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
